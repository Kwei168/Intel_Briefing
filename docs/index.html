<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intel Briefing - 每日情报日报</title>
<script>try{var _t=localStorage.getItem('wb_starhub_theme_v1')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=_t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ════════════ tokens — 对齐 StarHub _build_css() ════════════ */
:root {
  --bg:#faf9f7; --card:#fffdf9; --card-2:#f3efe6; --card-3:#ebe6db;
  --ink:#1c1917; --muted:#5f594c; --faint:#6e685e;
  --line:#ddd6c9; --line-strong:#b9b0a2;
  --brand:#2f5d8a; --brand-strong:#24496e; --brand-line:#b9cde0; --brand-weak:#e7eef4;
  --display:"Noto Serif SC","Georgia","Times New Roman","Songti SC","SimSun","STSong",serif;
  --body:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono","SF Mono","Fira Code","Consolas",monospace;
  --radius:8px;
  --shadow:0 1px 2px rgba(28,25,23,.05);
  --shadow-lift:0 10px 26px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
}
[data-theme="dark"] {
  --bg:#161412; --card:#1d1a17; --card-2:#262019; --card-3:#2f2820;
  --ink:#ece7df; --muted:#a59d90; --faint:#a8a090;
  --line:#37312a; --line-strong:#4a4339;
  --brand:#8fb3d9; --brand-strong:#b0cbe6; --brand-line:#3d5a78; --brand-weak:#22303f;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lift:0 10px 26px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.4);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { font-family:var(--body); background:var(--bg); color:var(--ink); line-height:1.55; font-size:14px; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
::selection { background:var(--brand-weak); color:var(--ink); }
button:focus-visible, .card:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--brand); outline-offset:2px; border-radius:var(--radius); }
mark { background:var(--brand-weak); color:var(--brand-strong); padding:0 2px; border-radius:3px; }

/* ════════════ Header（毛玻璃） ════════════ */
header { position:sticky; top:0; z-index:40; background:rgba(250,249,247,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
[data-theme="dark"] header { background:rgba(22,20,18,.94); }
.hd { max-width:1560px; margin:0 auto; padding:9px 20px; display:flex; align-items:center; gap:12px; }
.hd .logo { display:flex; align-items:center; gap:8px; flex:none; font-family:var(--display); font-weight:900; font-size:16px; }
.hd .logo .sub { font-size:11px; color:var(--muted); font-weight:400; margin-left:2px; font-family:var(--body); }
.hd .logo svg { color:var(--brand); }
.hd .nav-links { display:flex; align-items:center; gap:2px; flex:1; }
.hd .nav-links a { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:500; border:1px solid transparent; transition:all .15s; }
.hd .nav-links a:hover { background:var(--card); border-color:var(--line); }
.hd .nav-links a.active { background:var(--brand-weak); border-color:var(--brand-line); color:var(--brand-strong); font-weight:600; }
.theme-btn { width:30px; height:30px; border-radius:999px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none; transition:all .15s; }
.theme-btn:hover { border-color:var(--brand-line); color:var(--brand-strong); }
.theme-btn svg { width:14px; height:14px; }
.icon-moon { display:none; }
[data-theme="dark"] .icon-sun { display:none; }
[data-theme="dark"] .icon-moon { display:block; }

/* ════════════ Toolbar ════════════ */
.toolbar { max-width:1560px; margin:0 auto; padding:14px 20px 4px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.toolbar h1 { font-family:var(--display); font-size:19px; font-weight:900; margin-right:2px; }
.toolbar h1 .tick { color:var(--brand); }
.tool-meta { font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap; }

/* ════════════ Search row ════════════ */
.search-row { max-width:1560px; margin:0 auto; padding:10px 20px 0; display:flex; align-items:center; gap:10px; }
.global-search { position:relative; flex:1; min-width:0; max-width:560px; }
.global-search input { width:100%; padding:10px 36px 10px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); font-size:14px; color:var(--ink); font-family:var(--body); outline:none; transition:border-color .15s, box-shadow .15s; }
.global-search input:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-weak); }
.global-search input::placeholder { color:var(--faint); font-size:13.5px; }
.global-search .sx { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:22px; height:22px; border-radius:999px; background:var(--line); color:var(--muted); display:none; align-items:center; justify-content:center; font-size:11px; cursor:pointer; transition:all .15s; }
.global-search .sx:hover { background:var(--line-strong); color:var(--ink); }
.global-search.has-q .sx { display:flex; }
.search-hint { font-family:var(--mono); font-size:10.5px; color:var(--faint); white-space:nowrap; }
.search-hint kbd { display:inline-block; min-width:16px; text-align:center; padding:1px 5px; border-radius:5px; border:1px solid var(--line); background:var(--card); font-family:var(--mono); font-size:10px; color:var(--muted); }

/* ════════════ Year chips ════════════ */
.chips-row { max-width:1560px; margin:0 auto; padding:10px 20px 0; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { padding:4px 12px; border-radius:999px; font-size:12px; font-weight:500; border:1px solid var(--line); background:var(--card); color:var(--muted); transition:all .15s; white-space:nowrap; }
.chip:hover { border-color:var(--line-strong); color:var(--ink); }
.chip.on { background:var(--brand-weak); border-color:var(--brand-line); color:var(--brand-strong); font-weight:600; }
.chip .n { font-family:var(--mono); font-size:10px; opacity:.75; margin-left:3px; }

/* ════════════ Card wall（瀑布流） ════════════ */
.wall-wrap { max-width:1560px; margin:0 auto; padding:14px 20px 60px; }
.wall { columns:3 300px; column-gap:14px; }
.card { break-inside:avoid; margin-bottom:14px; display:block; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px 12px; position:relative; transition:box-shadow .18s, border-color .18s, transform .18s; }
.card:hover { border-color:var(--brand-line); box-shadow:var(--shadow-lift); transform:translateY(-2px); }
.card-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.issue-tag { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--brand-strong); text-transform:uppercase; }
.issue-tag::before { content:""; display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px; vertical-align:1px; background:var(--brand); }
.latest-badge { font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.08em; color:#fff; background:var(--brand); border-radius:4px; padding:1px 6px; box-shadow:0 0 0 3px var(--brand-weak); }
.card-week { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--faint); }
.card-title { font-family:var(--display); font-size:15.5px; font-weight:700; line-height:1.45; margin-bottom:7px; color:var(--ink); transition:color .15s; }
.card:hover .card-title { color:var(--brand-strong); }
.card-desc { font-size:12.5px; color:var(--muted); line-height:1.7; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-foot { display:flex; align-items:center; gap:6px; margin-top:11px; padding-top:9px; border-top:1px solid var(--line); font-size:11px; color:var(--faint); }
.card-foot .brandline { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; }
.card-foot .go { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--brand-strong); display:inline-flex; align-items:center; gap:4px; }
.card-foot .go .arr { transition:transform .15s; display:inline-block; }
.card:hover .card-foot .go .arr { transform:translateX(2px); }
.card.latest { border-color:var(--brand-line); background:linear-gradient(180deg, var(--brand-weak), var(--card) 62%); }

/* ════════════ 空态 / 加载 / 失败 ════════════ */
.empty-hint { text-align:center; color:var(--faint); font-size:13px; padding:60px 0; line-height:2; }
.boot-loading { display:flex; align-items:center; justify-content:center; gap:10px; padding:72px 16px; color:var(--muted); font-size:13px; }
.boot-spin { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:bootspin .8s linear infinite; }
@keyframes bootspin { to { transform:rotate(360deg); } }

/* ════════════ Footer ════════════ */
.footer { text-align:center; padding:12px 0; font-size:11px; color:var(--faint); font-family:var(--mono); border-top:1px solid var(--line); }
.footer a { color:var(--brand-strong); }
.footer a:hover { text-decoration:underline; text-underline-offset:2px; }

/* ════════════ Back to top ════════════ */
.back-top { position:fixed; bottom:24px; right:24px; width:40px; height:40px; border-radius:50%; background:var(--card); border:1px solid var(--line); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; pointer-events:none; transition:all .2s; z-index:90; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.back-top.show { opacity:1; pointer-events:auto; }
.back-top:hover { color:var(--brand-strong); border-color:var(--brand-line); background:var(--brand-weak); }
.back-top svg { width:18px; height:18px; }

/* ════════════ Keyboard help（? 面板） ════════════ */
.kbd-help { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; }
.kbd-help.open { display:flex; }
.kbd-help-backdrop { position:absolute; inset:0; background:rgba(28,25,23,.55); }
.kbd-help-panel { position:relative; z-index:1; width:min(360px,88vw); background:var(--bg); border-radius:16px; box-shadow:0 24px 80px rgba(0,0,0,.25); padding:20px; }
.kbd-help-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.kbd-help-hd h3 { font-family:var(--display); font-size:15px; font-weight:900; }
.kbd-help-close { width:28px; height:28px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all .15s; }
.kbd-help-close:hover { border-color:var(--line-strong); color:var(--ink); }
.kbd-help-body table { width:100%; border-collapse:collapse; }
.kbd-help-body td { padding:6px 0; font-size:13px; color:var(--muted); vertical-align:middle; }
.kbd-help-body td:first-child { width:120px; }
.kbd-help-body kbd { display:inline-block; min-width:22px; text-align:center; padding:2px 6px; border-radius:5px; border:1px solid var(--line); background:var(--card); font-family:var(--mono); font-size:12px; color:var(--ink); line-height:1.5; }

/* ════════════ Reduced motion ════════════ */
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition-duration:0s!important; animation-duration:0s!important; } }

/* ════════════ Responsive ════════════ */
@media (max-width:1100px) {
  .wall { columns:2 280px; }
}
@media (max-width:900px) {
  .hd .logo .sub { display:none; }
  .toolbar { padding:12px 14px 2px; }
  .search-row { padding:8px 14px 0; }
  .chips-row { padding:8px 14px 0; }
  .wall-wrap { padding:12px 14px 50px; }
}
@media (max-width:700px) {
  .hd .nav-links a { padding:5px 9px; font-size:12px; }
  .toolbar h1 { font-size:17px; }
  .tool-meta { display:none; }
  .search-row { flex-wrap:wrap; }
  .search-hint { display:none; }
  .chips { overflow-x:auto; flex-wrap:nowrap; max-width:100%; padding-bottom:4px; -webkit-mask-image:linear-gradient(to right,#000 90%,transparent 100%); mask-image:linear-gradient(to right,#000 90%,transparent 100%); }
  .chip { white-space:nowrap; flex:none; }
  .wall { columns:1 minmax(0,1fr); }
  .card { padding:13px 15px 10px; }
  .card-title { font-size:14.5px; }
  .back-top { bottom:16px; right:16px; }
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <a class="logo" href="./index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/><path d="M4.9 19.1a10 10 0 0 1 0-14.2"/></svg>

    </nav>
    <button class="theme-btn" id="btnTheme" title="切换主题 (T)" aria-label="切换明暗主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
    </button>

<div class="toolbar">
  <h1>情报日报<span class="tick">.</span></h1>

</div>

  <div class="global-search" id="searchBox">
    <input id="q" type="search" autocomplete="off" placeholder="搜索日期或标题，如 09-09、AI、日报…" aria-label="搜索日报">

<script>
;(function(){
  /* ── 主题（共享 StarHub 存储 key） ── */
  var btn=document.getElementById('btnTheme');
  function setTheme(t){
    try{ localStorage.setItem('wb_starhub_theme_v1',t); }catch(e){}
    document.documentElement.dataset.theme=t;
  }
  if(btn) btn.onclick=function(){ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); };

  /* ── 工具 ── */
  var WEEK=['日','一','二','三','四','五','六'];
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function hi(s,q){
    var e=esc(s); if(!q) return e;
    try{ return e.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }catch(_){ return e; }
  }
  function weekday(dateStr,full){
    var d=new Date(dateStr+'T00:00:00'); if(isNaN(d)) return '';
    return full?'星期'+WEEK[d.getDay()]:WEEK[d.getDay()];
  }

  /* ── 数据 ── */
  var ALL=[], state={ q:'', year:'all' };
  var wall=document.getElementById('wall');
  var chipsEl=document.getElementById('chips');
  var searchBox=document.getElementById('searchBox');
  var qInput=document.getElementById('q');

  function fail(msg,countTxt){
    wall.innerHTML='<div class="empty-hint">'+msg+'</div>';
    if(countTxt!==undefined){ var m=document.getElementById('tool-meta'); if(m) m.textContent=countTxt; }
  }

  fetch('./reports.json')
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(list){
      if(!list||!list.length){ fail('暂无日报，请等待下次自动构建','0 期'); return; }
      ALL=list.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      ALL.forEach(function(r,i){
        r.issue=ALL.length-i;
        r.year=(r.date||'').slice(0,4);
        r.week=weekday(r.date,true);
      });
      var tm=document.getElementById('tool-meta');
      if(tm) tm.textContent='共 '+ALL.length+' 期 · 最近更新 '+(ALL[0]&&ALL[0].date||'--')+' · '+weekday(ALL[0].date,true);
      buildChips();
      render();
    })
    .catch(function(){ fail('加载失败，请刷新重试','--'); });

  /* ── 年份 chips ── */
  function buildChips(){
    var years=[]; ALL.forEach(function(r){ if(years.indexOf(r.year)<0) years.push(r.year); });
    var html='<button class="chip on" data-y="all">全部<span class="n">'+ALL.length+'</span></button>';
    years.forEach(function(y){
      var n=ALL.filter(function(r){ return r.year===y; }).length;
      html+='<button class="chip" data-y="'+esc(y)+'">'+esc(y)+'<span class="n">'+n+'</span></button>';
    });
    chipsEl.innerHTML=html;
    chipsEl.onclick=function(e){
      var b=e.target.closest('.chip'); if(!b) return;
      state.year=b.getAttribute('data-y');
      chipsEl.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on',c===b); });
      render();
    };
  }

  /* ── 渲染卡片墙 ── */
  function render(){
    var q=state.q.trim().toLowerCase(), y=state.year;
    var items=ALL.filter(function(r){
      if(y!=='all' && r.year!==y) return false;
      if(q && (((r.title||'')+' '+(r.date||'')).toLowerCase().indexOf(q)<0)) return false;
      return true;
    });
    if(!items.length){
      wall.innerHTML='<div class="empty-hint">没有匹配的日报<br>换个关键词或年份试试</div>';
      return;
    }
    var showLatest=(y==='all'&&!q);
    var html=items.map(function(r){
      var latest=showLatest&&r===ALL[0];
      return '<a class="card'+(latest?' latest':'')+'" href="./reports/'+esc(r.file)+'">'
        +'<div class="card-top">'
        +  '<span class="issue-tag">Issue #'+String(r.issue).padStart(2,'0')+'</span>'
        +  (latest?'<span class="latest-badge">LATEST</span>':'')
        +  '<span class="card-week">'+esc(r.week?r.week.slice(0,3):'')+'</span>'
        +'</div>'
        +'<div class="card-title">'+hi(r.title||r.date,q)+'</div>'
        +'<div class="card-desc">'+(r.week?esc(r.week):'晨间')+'情报汇总 · 覆盖科技趋势 / 资本流动 / AI 前沿等板块，多源聚合，AI 编纂。</div>'
        +'<div class="card-foot">'
        +  '<span class="brandline">MORNING BRIEF</span>'
        +  '<span class="go">阅读全文<span class="arr">→</span></span>'
        +'</div>'
        +'</a>';
    }).join('');
    wall.innerHTML=html;
  }

  /* ── 搜索 ── */
  if(qInput){
    qInput.addEventListener('input',function(){
      state.q=this.value;
      searchBox.classList.toggle('has-q',!!this.value);
      render();
    });
  }
  var sx=document.getElementById('sx');
  if(sx) sx.onclick=function(){
    state.q=''; qInput.value=''; searchBox.classList.remove('has-q'); render(); qInput.focus();
  };

  /* ── 回到顶部 ── */
  var backTop=document.getElementById('backTop');
  window.addEventListener('scroll',function(){ backTop.classList.toggle('show',window.scrollY>400); },{passive:true});
  backTop.onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };

  /* ── 键盘快捷键 ── */
  var help=document.getElementById('kbdHelp');
  function openHelp(){ help.classList.add('open'); }
  function closeHelp(){ help.classList.remove('open'); }
  function toggleHelp(){ help.classList.toggle('open'); }
  document.getElementById('kbdClose').onclick=closeHelp;
  document.getElementById('kbdBackdrop').onclick=closeHelp;
  document.addEventListener('keydown',function(e){
    var t=e.target, tag=(t.tagName||'').toLowerCase();
    var typing=tag==='input'||tag==='textarea'||t.isContentEditable;
    if(e.key==='Escape'){
      closeHelp();
      if(typing&&document.activeElement===qInput){ qInput.blur(); }
      return;
    }
    if(typing) return;
    if(e.key==='/'){ e.preventDefault(); qInput.focus(); qInput.select(); }
    else if(e.key==='?'){ toggleHelp(); }
    else if(e.key==='t'||e.key==='T'){ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); }
    else if(e.key==='g'||e.key==='G'){ window.scrollTo({top:0,behavior:'smooth'}); }
  });
})();
</script>
</body>
</html>
