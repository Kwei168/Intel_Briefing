name: Daily Intelligence Report

on:
  schedule:
    - cron: '51 23 * * *'  # UTC 23:51 = Beijing 07:51
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt markdown

      - name: Generate Morning Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: https://openrouter.ai/api/v1/chat/completions
          XAI_MODEL: x-ai/grok-4-fast
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cli.py

      - name: Build Pages site
        run: |
          mkdir -p docs/reports
          python3 .github/build_pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deliver report to PWA (optional)
        env:
          PWA_DEPLOY_TOKEN: ${{ secrets.PWA_DEPLOY_TOKEN }}
          PWA_REPO: ${{ vars.PWA_REPO }}
        run: |
          if [ -z "$PWA_DEPLOY_TOKEN" ] || [ -z "$PWA_REPO" ]; then
            echo "PWA delivery skipped."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          REPORT="reports/daily_briefings/Morning_Report_${DATE}.md"
          SUMMARIES="reports/summaries/${DATE}.json"
          if [ ! -f "$REPORT" ]; then
            echo "Report not found: $REPORT"
            exit 1
          fi
          git clone https://x-access-token:${PWA_DEPLOY_TOKEN}@github.com/${PWA_REPO}.git /tmp/pwa
          cp "$REPORT" /tmp/pwa/data/daily_briefings/
          if [ -f "$SUMMARIES" ]; then
            mkdir -p /tmp/pwa/public/data/summaries
            cp "$SUMMARIES" /tmp/pwa/public/data/summaries/
          fi
          cd /tmp/pwa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_briefings/
          if [ -d public/data/summaries ]; then git add -f public/data/summaries/; fi
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "data: add daily report ${DATE}"
            git push
          fi
